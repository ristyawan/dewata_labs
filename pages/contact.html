<div class="page-view" id="view-contact">
<section class="container" style="padding-top: calc(var(--nav-height) + 80px);">
<div class="section-header">
<h2>System Gateway</h2>
<p>Establish a secure communication channel with our technical team.</p>
</div>
<div style="max-width: 600px;">
<form id="contact-form" onsubmit="app.submitContact(event)">
<div class="form-group">
<label class="form-label font-code text-muted">name</label>
<input class="form-control" placeholder="John Doe" required="" type="text"/>
</div>
<div class="form-group">
<label class="form-label font-code text-muted">business_email</label>
<input class="form-control" placeholder="john@company.com" required="" type="email"/>
</div>
<div class="form-group">
<label class="form-label font-code text-muted">project_description</label>
<textarea class="form-control" placeholder="Briefly describe your requirements..." required="" rows="5"></textarea>
</div>
<button class="btn btn-primary" style="width: 100%;" type="submit">Execute POST Request</button>
</form>
</div>
</section>
</div>
